{{define "messages"}}
{{if .}}
<ul id="messages">
  {{range $id, $message := .}}
  <li><label class="blue">{{$message.Author}}: </label>{{$message.Msg}}</li>
  {{end}}
</ul>
{{end}}
{{end}}

{{define "messageboard"}}
{{if .}}
<div id="message-container">
  <div id="message-log" hx-get="/messages" hx-trigger="load" hx-target="#messages">
    {{template "messages" .Messages}}
  </div>
  {{if .User.Id}}
  <form id="message-bar"> 
    <label>
      <span class="blue">{{.User.Name}}</span>
       @ 
      <span class="yellow">home</span>
    </label>
    <label>&nbsp;&gt;&gt;</label>
    <input autofocus id="message-input" type="text" name="message" placeholder="*tap,tap,tap*" />
    <button hx-post="/message" hx-swap="none" hx-on::after-request="clearInput()">
      <span>[</span>###<span>]</span>
    </button>
  </form>
  <!-- Server-Sent Events -> live message updates without hot-pinging -->
  <script>
    const es = new EventSource("http://localhost:8080/msg-channel");
    es.onmessage = (event) => {
      const data = JSON.parse(event.data);
      console.log(data);
      const authorText = document.createTextNode(`${data.Author}: `);
      const messageText = document.createTextNode(data.Msg);

      const messagesUl = document.getElementById("messages");
      const newMsgLi = document.createElement("li");
      const newMsgAuthorLabel = document.createElement("label");
      newMsgAuthorLabel.classList.add("blue");
      newMsgAuthorLabel.appendChild(authorText);
      newMsgLi.appendChild(newMsgAuthorLabel);
      newMsgLi.appendChild(messageText);
      messagesUl.appendChild(newMsgLi);
    }

    function clearInput() {
      document.getElementById("message-input").value = "";
    }
  </script>
  {{end}}
</div>

{{end}}
{{end}}
